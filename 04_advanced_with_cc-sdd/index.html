<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="manifest" href="manifest.json" />
        <!-- PWA: manifest.json読み込み -->
        <title>位置情報アプリケーション開発実践編</title>
    </head>
    <body style="margin: 0">
        <div id="map" style="height: 100vh"></div>
        <!-- 背景地図切り替えUI受け皿 -->
        <div id="basemap-control" class="basemap-control"></div>
        <!-- 出典表示エリア -->
        <div id="basemap-attribution" class="basemap-attribution"></div>
        <!-- 失敗表示エリア（初期は非表示） -->
        <div id="basemap-error" class="basemap-error" style="display:none"></div>
        <script type="module" src="./main.js"></script>
        <script>
            // PWA: ServiceWorker読み込み
            if ('serviceWorker' in navigator)
                navigator.serviceWorker.register('./sw.js');
        </script>
    </body>
</html>
