<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./style.css" />
        <link rel="manifest" href="manifest.json" />
        <!-- PWA: manifest.json読み込み -->
        <title>位置情報アプリケーション開発実践編</title>
    </head>
    <body style="margin: 0">
        <div id="map" style="height: 100vh"></div>
        <!-- 背景地図切り替えコントロール -->
        <div id="basemap-control">
            <label><input type="radio" name="basemap" value="osm" checked> OpenStreetMap</label>
            <label><input type="radio" name="basemap" value="gsi-std"> 地理院地図</label>
            <label><input type="radio" name="basemap" value="gsi-photo"> 航空写真</label>
        </div>
        <!-- タイル読み込みエラーメッセージ -->
        <div id="tile-error-message">タイルの読み込みに失敗しました</div>
        <script type="module" src="./main.js"></script>
        <script>
            // PWA: ServiceWorker読み込み
            if ('serviceWorker' in navigator)
                navigator.serviceWorker.register('./sw.js');
        </script>
    </body>
</html>
